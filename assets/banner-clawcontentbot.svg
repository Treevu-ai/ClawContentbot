<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Banner ClawContentbot</title>
  <desc id="desc">Banner con gradiente y mensaje principal del proyecto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <circle cx="220" cy="120" r="120" fill="#22d3ee" opacity="0.25" filter="url(#blur)"/>
  <circle cx="1380" cy="380" r="150" fill="#a78bfa" opacity="0.28" filter="url(#blur)"/>
  <circle cx="860" cy="80" r="90" fill="#f472b6" opacity="0.2" filter="url(#blur)"/>

  <g opacity="0.2" stroke="#c4b5fd" stroke-width="1">
    <path d="M0 380H1600"/>
    <path d="M0 320H1600"/>
    <path d="M0 260H1600"/>
  </g>

  <text x="120" y="190" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="64" font-weight="800">
    ClawContentbot
  </text>
  <text x="120" y="250" fill="#bfdbfe" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="500">
    Bot de Telegram para talleres, contenido y conversión guiada
  </text>

  <rect x="120" y="292" rx="14" ry="14" width="560" height="56" fill="rgba(15,23,42,0.65)" stroke="url(#accent)"/>
  <text x="148" y="328" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="600">
    Webhook + Menú interactivo + Verificación de assets
  </text>

  <g transform="translate(1040 115)">
    <rect x="0" y="0" width="390" height="260" rx="20" fill="rgba(15,23,42,0.65)" stroke="#818cf8"/>
    <text x="28" y="48" fill="#c4b5fd" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Flujo principal</text>
    <text x="28" y="90" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="20">/start → Menú</text>
    <text x="28" y="126" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="20">Info → Pricing → WhatsApp</text>
    <text x="28" y="162" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="20">/health · /ready</text>
    <text x="28" y="210" fill="#67e8f9" font-family="Inter, Segoe UI, sans-serif" font-size="18">Node.js 18+ · Telegram Bot API</text>
  </g>
</svg>
